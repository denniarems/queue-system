apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-queue-system
  labels:
    app: payment-queue-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment-queue-system
  template:
    metadata:
      labels:
        app: payment-queue-system
    spec:
      # Grace period allows in-flight jobs to complete cleanly before SIGKILL
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: payment-queue-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: payment-queue-config
            - secretRef:
                name: payment-queue-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
