apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-queue-config
  labels:
    app: payment-queue-system
data:
  PORT: "3000"
  NODE_ENV: "production"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  QUEUE_PREFIX: "bull:payments"
  QUEUE_WORKER_POOL_SIZE: "4"
  QUEUE_BACKOFF_BASE_MS: "500"
  QUEUE_BACKOFF_JITTER: "30"
  IDEMPOTENCY_LEASE_TTL_SECONDS: "600"
  IDEMPOTENCY_RETENTION_SECONDS: "86400"
  RATE_LIMIT_NOMINAL_RPS: "50"
  RATE_LIMIT_BURST_FACTOR: "2"
  RATE_LIMIT_MIN_RATE_FACTOR: "0.25"
  RATE_LIMIT_AI_STEP_RPS: "1"
  RATE_LIMIT_TOKEN_WAIT_MS: "15000"
  CIRCUIT_BREAKER_WINDOW_MS: "30000"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "0.5"
  CIRCUIT_BREAKER_MIN_SAMPLES: "10"
  CIRCUIT_BREAKER_COOLDOWN_MS: "30000"
  METRICS_WINDOW_SECONDS: "60"
  METRICS_BROADCAST_INTERVAL_MS: "1000"
  METRICS_ERROR_RATE_ALERT: "0.1"
  METRICS_P95_LATENCY_ALERT_MS: "1000"
  METRICS_QUEUE_DEPTH_ALERT: "200"
  METRICS_ALERT_COOLDOWN_MS: "10000"
